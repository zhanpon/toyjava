repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
    -   id: ruff-check
        args: ["--fix"]

-   repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "v1.11.3"
    hooks:
    -   id: tox-toml-fmt
